  <meta charset="UTF-8">

  <title>Kanban 2026</title>

<body>

  <header>
    <h2>Kanban 2026</h2>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 Search...">
      <select id="columnFilter">
        <option value="all">Filters</option>
        <option value="TO DO">TO DO</option>
        <option value="IN PROGRESS">IN PROGRESS</option>
        <option value="REVIEW">REVIEW</option>
        <option value="DONE">DONE</option>
      </select>
      <button id="addColumn">+ New Column</button>
    </div>
  </header>

  <div class="board" id="board">
  </div>

  <template id="template-columna">
    <div class="columna">
      <div class="columna-header">
        <input type="text" class="titulo-columna">
        <span class="contador-tareas">0</span>
      </div>
      <div class="contenedor-tareas"></div>
      <button class="add-card-btn">+ Add Card</button>
    </div>
  </template>

  <template id="template-tarea">
    <div class="tarea">
      <div class="tarea-top">
        <input type="text" placeholder="Escribe la tarea...">
      </div>
    </div>
  </template>
